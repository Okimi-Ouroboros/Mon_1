<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Панорама</title>

<style>
body { margin: 0; overflow: hidden; background:#000; }
canvas { display: block; }

/* ---------- INFO ---------- */
.info-box {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 16px;
    border-radius: 10px;
    max-width: 380px;
    width: calc(100% - 40px);
    z-index: 10;
    display: none;
}

.info-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#infoText {
    margin-top: 10px;
    font-size: 18px;
    line-height: 1.5;
}

.btn {
    height: 40px;
    width: 100px;
    padding: 0 16px;
    font-size: 16px;
}

/* ---------- TOUR NAV ---------- */
.tour-nav {
    position: fixed;
    top: 50%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
}

.tour-nav button {
    pointer-events: all;
    font-size: 26px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
}

#exitBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 20;
    width: 200px;
    height: 150px;
    font-size: 32px;

    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 10px 16px;
    font-size: 16px;
    cursor: pointer;
}

#exitBtn:hover {
    background: rgba(0,0,0,0.9);
}
</style>
</head>
<body>
<button id="exitBtn" onclick="goToMap()">← Карта</button>

<!-- INFO -->
<div class="info-box" id="infoBox">
    <div id="infoText"></div>
    <div class="info-header">
        <h3 id="infoTitle"></h3>
        <button class="btn" onclick="changeTextSize(-1)">A-</button>
        <button class="btn" onclick="changeTextSize(1)">A+</button>
        <button class="btn" onclick="closeInfo()">✕</button>
    </div>
</div>

<!-- TOUR BUTTONS -->
<div class="tour-nav" id="tourNav" style="display:none">
    <button onclick="prev()">⬅</button>
    <button onclick="next()">➡</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="map-data.js"></script>
<script src="pano-data.js"></script>
<script src="tour-data.js"></script>

<script>
/* ---------- URL ---------- */
const params = new URLSearchParams(location.search);
const mode = params.get("mode") ?? "map";

/* ---------- TOUR ---------- */
let step = Number(params.get("step") ?? 0);
let tourPath = [];

let panoId = Number(params.get("id"));

if (mode === "tour") {
    const start = params.get("start");
    const end = params.get("end");
    tourPath = routes[`${start}-${end}`];
    panoId = tourPath[step];
    document.getElementById("tourNav").style.display = "flex";
}

/* ---------- LOCATION ---------- */
const loc = locations.find(l => l.id === panoId);

/* ---------- SCENE ---------- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    loc.startFov ?? 75,
    window.innerWidth / window.innerHeight,
    1,
    1100
);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------- PANORAMA ---------- */
const geometry = new THREE.SphereGeometry(500, 60, 40);
geometry.scale(-1, 1, 1);

const texture = new THREE.TextureLoader().load(loc.panorama);
const sphere = new THREE.Mesh(
    geometry,
    new THREE.MeshBasicMaterial({ map: texture })
);
scene.add(sphere);

/* ---------- CAMERA ROTATION ---------- */
let lon = loc.startYaw ?? 0;
let lat = loc.startPitch ?? 0;

/* ---------- HOTSPOTS ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hotspots = [];

const textureLoader = new THREE.TextureLoader();

(panoHotSpots[panoId] || []).forEach(h => {

    // в экскурсии скрываем обычные переходы
    if (mode === "tour" && h.type === "scene") return;

    // выбираем иконку
    const icon =
        h.type === "scene"
            ? "images/arrow.png"
            : "images/hotspot.png";

    const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
            map: textureLoader.load(icon),
            depthTest: false,
            transparent: true
        })
    );

    // можно сделать стрелки чуть больше
    if (h.type === "scene") {
        sprite.scale.set(40, 40, 1);
    } else {
        sprite.scale.set(30, 30, 1);
    }

    const phi = THREE.MathUtils.degToRad(90 - h.pitch);
    const theta = THREE.MathUtils.degToRad(h.yaw);

    sprite.position.set(
        450 * Math.sin(phi) * Math.cos(theta),
        450 * Math.cos(phi),
        450 * Math.sin(phi) * Math.sin(theta)
    );

    sprite.userData = h;
    scene.add(sprite);
    hotspots.push(sprite);
});

/* ---------- INPUT ---------- */
let dragging = false, sx = 0, sy = 0;

addEventListener("mousedown", e => {
    dragging = true; sx = e.clientX; sy = e.clientY;
});

addEventListener("mousemove", e => {
    if (!dragging) return;
    lon += (sx - e.clientX) * 0.1;
    lat += (e.clientY - sy) * 0.1;
    sx = e.clientX; sy = e.clientY;
});

/* ---------- TOUCH ---------- */
addEventListener("touchstart", e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
});

addEventListener("touchmove", e => {
    lon += (sx - e.touches[0].clientX) * 0.1;
    lat += (e.touches[0].clientY - sy) * 0.1;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
});

addEventListener("mouseup", e => {
    dragging = false;
    checkHotspot(e.clientX, e.clientY);
});

addEventListener("touchend", () => {
    checkHotspot(sx, sy);
});

function goToMap() {
    location.href = "index.html";
}

/* ---------- HOTSPOT CLICK ---------- */
function checkHotspot(x, y) {
    mouse.x = (x / innerWidth) * 2 - 1;
    mouse.y = -(y / innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hit = raycaster.intersectObjects(hotspots)[0];
    if (!hit) return;

    const d = hit.object.userData;

    if (d.type === "info") showInfo(d);
    if (d.type === "scene" && mode === "map")
        location.href = `pano.html?id=${d.targetId}`;
}

/* ---------- INFO ---------- */
const infoBox = document.getElementById("infoBox");
const infoTitle = document.getElementById("infoTitle");
const infoText = document.getElementById("infoText");
let fontSize = 32;

function showInfo(d) {
    fontSize = 32;
    infoText.style.fontSize = fontSize + "px";

    infoTitle.textContent = d.title ?? "";
    infoText.innerHTML = d.text ?? "";

    infoBox.style.display = "block";
}

function closeInfo() {
    infoBox.style.display = "none";
}

function changeTextSize(delta) {
    fontSize += delta;
    infoText.style.fontSize = fontSize + "px";
}

/* ---------- TOUR NAV ---------- */
function next() {
    if (step < tourPath.length - 1)
        location.href = `pano.html?mode=tour&start=${tourPath[0]}&end=${tourPath.at(-1)}&step=${step+1}`;
}

function prev() {
    if (step > 0)
        location.href = `pano.html?mode=tour&start=${tourPath[0]}&end=${tourPath.at(-1)}&step=${step-1}`;
}

/* ---------- RESIZE ---------- */
addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

/* ---------- RENDER ---------- */
function animate() {
    requestAnimationFrame(animate);

    lat = Math.max(-85, Math.min(85, lat));
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);

    camera.lookAt(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
    );

    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
